version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: ceis-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ceis
      POSTGRES_PASSWORD: ceis123
      POSTGRES_DB: ceis_ai

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: